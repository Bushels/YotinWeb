<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060a0f">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Tamarack Valley Energy Engineering Screening | WellFi</title>
  <meta
    name="description"
    content="Read-only Tamarack Valley Energy WellFi engineering screen with UWI search, ranked candidate filters, public production context, and modeled economics."
  >
  <style>
    html,
    body,
    main,
    iframe {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    html,
    body {
      overflow: hidden;
      background: #060a0f;
    }

    iframe {
      display: block;
      border: 0;
      color-scheme: dark;
    }

    noscript {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      color: #dbe6ee;
      background: #060a0f;
      font: 600 0.875rem/1.5 Arial, sans-serif;
      text-align: center;
    }

    noscript a {
      color: #80d9ee;
    }
  </style>
</head>
<body>
  <main aria-label="Tamarack Valley Energy WellFi engineering workspace">
    <iframe
      src="https://wellfi-app.vercel.app/tamarack"
      title="Tamarack Valley Energy WellFi engineering screening workspace"
      loading="eager"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="fullscreen"
    ></iframe>
  </main>
  <noscript>
    <p>
      JavaScript is required for the engineering workspace.
      <a href="https://wellfi-app.vercel.app/tamarack">
        Open the Tamarack Valley Energy WellFi screen directly.
      </a>
    </p>
  </noscript>
</body>
</html>
